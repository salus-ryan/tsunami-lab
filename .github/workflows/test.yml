name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        run: mkdir -p artifacts && npm sbom --sbom-format cyclonedx > artifacts/tsunami-lab-sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: tsunami-lab-sbom
          path: artifacts/tsunami-lab-sbom.cdx.json
          retention-days: 90

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build hardened image
        run: docker build --tag tsunami-lab:${GITHUB_SHA} .
      - name: Verify health and security headers
        run: |
          docker run --detach --rm --name tsunami-lab-ci --publish 127.0.0.1:8080:8080 tsunami-lab:${GITHUB_SHA}
          trap 'docker stop tsunami-lab-ci' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/healthz | grep '"status":"ok"'
          headers="$(curl --fail --silent --head http://127.0.0.1:8080/)"
          grep -qi '^Content-Security-Policy:' <<< "$headers"
          grep -qi '^Permissions-Policy:' <<< "$headers"
          grep -qi '^X-Content-Type-Options: nosniff' <<< "$headers"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [unit, playwright, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
